<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AgWise, DSSAT and IWMI integration workflow</title>
  <desc id="desc">Approach 2 is the preferred IWMI rainfall integration. It is first proven with synthetic daily rainfall from monthly analysis totals and later uses IWMI daily rainfall in the same path. Approach 3 is a separate scenario-based DSSAT extension using IWMI evapotranspiration, irrigation probability, evaporative stress and water-access evidence to weight and rank management scenarios.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#176b78"/>
    </marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c47b16"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f8750"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 12; }
      .main { fill: #e8f4f5; stroke: #176b78; }
      .ref { fill: #f3f5f6; stroke: #65757b; }
      .interim { fill: #fff3d9; stroke: #c47b16; }
      .context { fill: #edf7ee; stroke: #2f8750; }
      .future { fill: #eaf3ff; stroke: #3e73a1; stroke-dasharray: 8 6; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #17343c; text-anchor: middle; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; fill: #43565d; text-anchor: middle; }
      .line { fill: none; stroke: #176b78; stroke-width: 3; marker-end: url(#arrow); }
      .orange-line { fill: none; stroke: #c47b16; stroke-width: 3; marker-end: url(#orange-arrow); }
      .green-line { fill: none; stroke: #2f8750; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#green-arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="38" class="label" font-size="24">AgWise–DSSAT–IWMI integration workflow</text>

  <rect x="55" y="95" width="250" height="74" class="box main"/>
  <text x="180" y="126" class="label">ECMWF forecast</text>
  <text x="180" y="151" class="label">+ hindcast</text>

  <rect x="390" y="95" width="250" height="74" class="box main"/>
  <text x="515" y="126" class="label">AgWise bias</text>
  <text x="515" y="151" class="label">correction</text>

  <rect x="725" y="95" width="250" height="74" class="box main"/>
  <text x="850" y="126" class="label">DSSAT weather</text>
  <text x="850" y="151" class="label">and soil handoff</text>

  <path d="M305 132 H390" class="line"/>
  <path d="M640 132 H725" class="line"/>

  <rect x="390" y="215" width="250" height="70" class="box ref"/>
  <text x="515" y="257" class="label">Reference observations</text>
  <path d="M515 285 V330 H850 V169" class="line"/>

  <rect x="725" y="350" width="250" height="74" class="box main"/>
  <text x="850" y="381" class="label">DSSAT</text>
  <text x="850" y="406" class="label">simulations</text>
  <path d="M850 169 V350" class="line"/>

  <rect x="725" y="480" width="250" height="74" class="box main"/>
  <text x="850" y="511" class="label">Ranked</text>
  <text x="850" y="536" class="label">advisory</text>
  <path d="M850 424 V480" class="line"/>

  <rect x="55" y="350" width="250" height="74" class="box interim"/>
  <text x="180" y="381" class="label">IWMI monthly</text>
  <text x="180" y="406" class="label">analysis</text>

  <rect x="390" y="350" width="250" height="74" class="box interim"/>
  <text x="515" y="381" class="label">Synthetic daily PRCP</text>
  <text x="515" y="406" class="small">(interim experiment)</text>
  <path d="M305 387 H390" class="orange-line"/>
  <path d="M640 424 V455 H700 V132 H725" class="orange-line"/>
  <text x="675" y="448" class="small" fill="#9a6112">PRCP override only</text>

  <rect x="55" y="480" width="250" height="74" class="box context"/>
  <text x="180" y="503" class="label">IWMI scenario evidence</text>
  <text x="180" y="526" class="small">rainfall • ET • irrigation</text>
  <text x="180" y="547" class="small">stress • water access</text>

  <rect x="390" y="480" width="250" height="74" class="box context"/>
  <text x="515" y="511" class="label">Display context</text>
  <text x="515" y="536" class="small">does not rerank DSSAT</text>
  <path d="M305 517 H390" class="green-line"/>
  <path d="M640 517 H725" class="green-line"/>
  <text x="682" y="505" class="small" fill="#2f8750">context only</text>

  <rect x="55" y="640" width="585" height="74" class="box future"/>
  <text x="347" y="671" class="label">Future IWMI daily rainfall</text>
  <text x="347" y="696" class="small">replaces synthetic PRCP; architecture unchanged</text>
  <path d="M347 640 V585 H515 V424" class="green-line"/>
  <text x="535" y="604" class="small" fill="#3e73a1">future scenario input</text>

  <rect x="725" y="610" width="250" height="104" rx="12" fill="#f7fafb" stroke="#b9c9cd"/>
  <text x="850" y="640" class="small">Preferred operational path</text>
  <line x1="755" y1="665" x2="805" y2="665" stroke="#176b78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="670" class="small" text-anchor="start">AgWise + DSSAT</text>
  <line x1="755" y1="695" x2="805" y2="695" stroke="#c47b16" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <text x="820" y="700" class="small" text-anchor="start">Scenario extension</text>
</svg>
